# gitleaks configuration: default rules plus repository-specific allowlisting.
# Scanned by the pre-commit hook (staged changes) and by CI (full history).
title = "fileops-cpp"

[extend]
useDefault = true

[allowlist]
description = "Strings that legitimately look like secrets"
paths = [
  '''^conan\.lock$''', # recipe revision hashes
]
# Action pins (`uses: owner/repo@<40-hex sha>`) and image digests (`@sha256:<64-hex>`) are not secrets.
# Matched on the whole line so the rest of the workflow files stay scanned.
regexTarget = "line"
regexes = [
  '''uses: [A-Za-z0-9_./-]+@[0-9a-f]{40}''',
  '''@sha256:[0-9a-f]{64}''',
]
