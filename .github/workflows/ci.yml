# Continuous integration: every push to main and every pull request.
#
#   format  ─┐  clang-format on the runner (it ships clang-format 18, the same major as the image)
#   secrets ├─ (independent, fast feedback)
#   lint    ─┘  shell, Dockerfile, YAML, Markdown, editorconfig, workflows, commit messages
#   test    ──  matrix: gcc-debug and clang-debug, both with ASan + UBSan; clang-tidy on the clang leg
#   build ──► smoke (matrix of clean Debian/Ubuntu containers)
#   diagnose (only on failure; AI-assisted summary from the captured telemetry)
#
# `test` and `build` run in the toolchain image. Pulling it costs ~25 s per job, so everything that
# needs the toolchain is grouped into as few jobs as the compiler matrix allows: one job per Debug
# compiler and one release job that builds, tests, packages and lints the shipped binary.
# Third-party actions are pinned to commit SHAs; Dependabot bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request pushes are cancelled; main runs always complete so every merge has a record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # container steps otherwise get `sh -e`, which has no pipefail

env:
  CI: "true"
  # Pre-release build number so CI artefacts sort below any tagged release.
  VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  format:
    # Runs on the host: the runner image ships clang-format 18, which avoids pulling the toolchain
    # image just to check formatting. scripts/format.sh refuses any other major version.
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify formatting
        run: scripts/format.sh --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the whole history is scanned, not just the pushed commits
          persist-credentials: false
      - name: gitleaks over the full history
        # The pinned image rather than gitleaks-action: the action scans only the pushed commits or
        # the PR range, so a secret in any older commit would never be reported.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git --no-banner --redact --exit-code 1 .

  lint:
    # Everything that is not C++: shell (shellcheck, shfmt), Dockerfiles (hadolint), YAML, Markdown,
    # editorconfig conformance, workflow syntax (actionlint) and Conventional Commits. Each tool runs
    # from the pinned image named in scripts/lint.sh, so `make lint` locally checks the same rules;
    # zizmor runs through its action so findings land in code scanning.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # zizmor uploads SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commit-message check needs the base branch
          persist-credentials: false
      - name: Lint everything that is not C++
        env:
          LINT_PREFER_DOCKER: "1"
        run: scripts/lint.sh shell docker yaml markdown editorconfig workflows
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/check-commits.sh "$BASE..$HEAD"
      - name: zizmor
        if: ${{ !env.ACT }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  test:
    # Debug builds with AddressSanitizer and UndefinedBehaviorSanitizer under both compilers. The
    # clang leg also runs clang-tidy, which needs the compile database this configure produces.
    name: Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a cold Conan cache compiles protobuf, OpenSSL, libcurl and opentelemetry-cpp
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, clang-debug]
    container:
      image: ghcr.io/andrewczwu/fileops-cpp-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Run as the image's unprivileged user so permission-denied tests execute instead of skipping.
      options: --user 1001:1001
    env:
      HOME: /home/builder
      # Conan's home inside the workspace so actions/cache can save and restore it whatever user or
      # HOME the container runs with. Under act this path is resolved from the network each run.
      CONAN_HOME: ${{ github.workspace }}/.conan2
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache Conan packages
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ matrix.preset }}-${{ hashFiles('conan.lock', 'conan/profiles/*', 'conanfile.py') }}
      - name: Build and test (ASan + UBSan)
        run: make test
      - name: clang-tidy
        if: matrix.preset == 'clang-debug'
        run: make tidy
      - name: Telemetry evidence
        if: always()
        run: scripts/telemetry-summary.sh "artifacts/logs/$PRESET/cli-runs.ndjson" >> "$GITHUB_STEP_SUMMARY"
      - name: Test report
        if: ${{ always() && !env.ACT }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Test results (${{ matrix.preset }})
          path: artifacts/test-results/*.xml
          reporter: java-junit
          use-actions-summary: "true"
      - name: Upload test artefacts
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.preset }}
          path: |
            artifacts/test-results
            artifacts/logs
          retention-days: 14

  build:
    # The shipped configuration: GCC 14, -O2, fully static. Its own test run is what
    # proves the release binary, then CPack builds the .deb and lintian checks it, all in one job.
    name: Build, test & package (gcc-release)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a cold Conan cache compiles protobuf, OpenSSL, libcurl and opentelemetry-cpp
    container:
      image: ghcr.io/andrewczwu/fileops-cpp-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001:1001
    env:
      HOME: /home/builder
      # Conan's home inside the workspace so actions/cache can save and restore it whatever user or
      # HOME the container runs with. Under act this path is resolved from the network each run.
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache Conan packages
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-gcc-release-${{ hashFiles('conan.lock', 'conan/profiles/*', 'conanfile.py') }}
      - name: Build, test and package
        run: make package
      - name: lintian
        run: make lint-deb
      - name: Telemetry evidence
        if: always()
        run: scripts/telemetry-summary.sh artifacts/logs/gcc-release/cli-runs.ndjson >> "$GITHUB_STEP_SUMMARY"
      - name: Artefact summary
        run: scripts/ci/artifact-summary.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Test report
        if: ${{ always() && !env.ACT }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Test results (gcc-release)
          path: artifacts/test-results/*.xml
          reporter: java-junit
          use-actions-summary: "true"
      - name: Upload test artefacts
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-gcc-release
          path: |
            artifacts/test-results
            artifacts/logs
          retention-days: 14
      - name: Upload package
        # Not guarded for act: the smoke job downloads it, and .actrc points act at a local artifact server.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fileops-cpp-deb
          path: artifacts/deb
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, debian:trixie-slim, ubuntu:22.04, ubuntu:24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fileops-cpp-deb
          path: artifacts/deb
      - name: Install and exercise the package
        env:
          SMOKE_IMAGES: ${{ matrix.image }}
        run: scripts/smoke-test.sh

  diagnose:
    # Optional, opt-in via repository secret. Reads the captured NDJSON telemetry and test results
    # and posts a structured root-cause summary, so the first look at a red build is already informed.
    name: AI failure diagnosis
    needs: [test, build, smoke]
    # Same-repository pull requests only: there is a PR to comment on, and the artefacts handed to the
    # model were produced from code that passed the ruleset, not from an arbitrary fork.
    if: >-
      ${{ failure()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for API key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          pattern: test-results-*
          path: artifacts
          merge-multiple: true
      - name: Diagnose from telemetry
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The CI run for this commit failed. Diagnose it from evidence only; do not modify files.
            Evidence: artifacts/test-results/*.xml (JUnit test outcomes per preset),
            artifacts/logs/<preset>/cli-runs.ndjson (structured logs from every CLI invocation: a
            header {"run":{args,exitCode}} followed by JSON log records with EventId/LogLevel/State).
            Sanitizer reports, if any, are in the failing test's output inside the JUnit file.
            docs/OBSERVABILITY.md explains the event ids.
            Report: (1) which tests failed and under which preset, (2) the log records or sanitizer
            output that explain each failure, quoting EventId and State fields, (3) the most likely
            root cause in the source, with file:line, (4) whether it looks flaky or deterministic.
            Keep it under 300 words.
          claude_args: --max-turns 8 --model claude-sonnet-5-5
