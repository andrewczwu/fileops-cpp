# Builds and publishes the toolchain image that every other workflow (and `make docker-*`) runs in.
# Rebuilt only when its inputs change, plus weekly to pick up base-image security patches.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile.build
      - .github/workflows/build-image.yml
  pull_request:
    # Build (without pushing) so a broken Dockerfile is caught before it reaches main.
    paths:
      - docker/Dockerfile.build
      - .github/workflows/build-image.yml
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Per-ref group: a pull-request build must never cancel the main publish that CI pulls from.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fileops-cpp-build
          tags: |
            type=raw,value=main
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker
          file: docker/Dockerfile.build
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Toolchain image"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
            echo
            echo "To pin workflows to this exact build, reference \`ghcr.io/${{ github.repository_owner }}/fileops-cpp-build@$DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"
